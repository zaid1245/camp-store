<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Camp Store · ملابس ومعدات التخييم</title>
<meta name="description" content="Camp Store — ملابس ومعدات تخييم تصمد في الخارج. اطلب مباشرة عبر واتساب.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- ════════ الترويسة / Header ════════ -->
<header>
  <div class="wrap bar">
    <a class="brand" href="#top">
      <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <path d="M24 6 41 38H7L24 6z" fill="var(--leaf)"/>
        <path d="M24 17 33 38H15l9-21z" fill="var(--leaf-dark)"/>
        <path d="M24 38v5M5 43h38" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
      </svg>
      <span class="txt"><b>Camp Store</b><small data-i18n="brand.sub">كامب ستور</small></span>
    </a>

    <nav>
      <a href="#catalog" data-i18n="nav.products">المنتجات</a>
      <a href="#promise" data-i18n="nav.why">لماذا نحن</a>
      <a href="#footer"  data-i18n="nav.contact">تواصل معنا</a>
    </nav>

    <div class="tools">
      <!-- زر تبديل اللغة -->
      <button class="lang-btn" id="langBtn" data-i18n-aria="aria.lang" aria-label="Switch language">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="12" r="9.2"/><path d="M3 12h18M12 2.8c2.5 2.6 3.8 5.8 3.8 9.2S14.5 18.6 12 21.2C9.5 18.6 8.2 15.4 8.2 12S9.5 5.4 12 2.8z"/>
        </svg>
        <span id="langLabel">EN</span>
      </button>

      <button class="icon-btn" id="themeBtn" data-i18n-aria="aria.theme" aria-label="تبديل المظهر">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>

      <button class="icon-btn" id="cartBtn" aria-expanded="false" aria-controls="cartPanel" aria-label="سلة المشتريات">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1.4 12.2a1.5 1.5 0 0 1-1.5 1.8H6.1a1.5 1.5 0 0 1-1.5-1.8L6 7z"/><path d="M9 9V6a3 3 0 0 1 6 0v3"/></svg>
        <span class="count" id="cartCount" hidden>0</span>
      </button>
    </div>
  </div>
</header>

<main id="top">

  <!-- ════════ الواجهة / Hero ════════ -->
  <div class="wrap hero">
    <div class="hero-grid">
      <div>
        <h1 data-i18n-html="hero.title">ملابس تصمد<br>حيث <em>تنتهي الطرق</em></h1>
        <p data-i18n="hero.desc"></p>
        <div class="hero-actions">
          <a class="btn" href="#catalog" data-i18n="hero.browse">تصفّح المنتجات</a>
          <button class="btn wa" id="heroWa">
            <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.3 1.3-1.9 1.4-.5 0-1.1.2-3.6-.8-3-1.3-5-4.4-5.1-4.6-.2-.2-1.2-1.6-1.2-3.1 0-1.5.8-2.2 1-2.5.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.4-.1.7.2.3.8 1.4 1.8 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.2.4-.2.6-.1l2.2 1c.3.1.5.2.5.4z"/></svg>
            <span data-i18n="hero.ask">اسألنا على واتساب</span>
          </button>
        </div>
      </div>
      <div class="hero-figure">
        <div class="disc"></div>
        <div class="art" id="heroArt"></div>
      </div>
    </div>

    <div class="marquee">
      <div data-i18n-html="mq.1"></div>
      <div data-i18n-html="mq.2"></div>
      <div data-i18n-html="mq.3"></div>
      <div data-i18n-html="mq.4"></div>
    </div>
  </div>

  <!-- ════════ المنتجات / Catalog ════════ -->
  <section class="catalog wrap" id="catalog">
    <div class="sec-head">
      <div>
        <h2 data-i18n="cat.title">منتجات كامب ستور</h2>
        <p data-i18n="cat.sub"></p>
      </div>
      <div class="filters" id="filters"></div>
    </div>
    <div class="grid" id="grid"></div>
  </section>

  <!-- ════════ لماذا نحن / Why us ════════ -->
  <section class="promise" id="promise">
    <div class="wrap promise-grid">
      <div>
        <div class="kicker" data-i18n="why.1.k"></div>
        <h3 data-i18n="why.1.t"></h3>
        <p data-i18n="why.1.d"></p>
      </div>
      <div>
        <div class="kicker" data-i18n="why.2.k"></div>
        <h3 data-i18n="why.2.t"></h3>
        <p data-i18n="why.2.d"></p>
      </div>
      <div>
        <div class="kicker" data-i18n="why.3.k"></div>
        <h3 data-i18n="why.3.t"></h3>
        <p data-i18n="why.3.d"></p>
      </div>
    </div>
  </section>
</main>

<!-- ════════ التذييل / Footer ════════ -->
<footer id="footer">
  <div class="wrap foot-grid">
    <div>
      <div class="brand" style="pointer-events:none">
        <svg class="mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
          <path d="M24 6 41 38H7L24 6z" fill="var(--leaf)"/><path d="M24 17 33 38H15l9-21z" fill="var(--leaf-dark)"/>
          <path d="M24 38v5M5 43h38" stroke="var(--ink)" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <span class="txt"><b style="color:var(--ink)">Camp Store</b><small data-i18n="brand.sub">كامب ستور</small></span>
      </div>
      <p data-i18n="foot.address"></p>
    </div>
    <div>
      <p style="margin:0"><span data-i18n="foot.wa">واتساب</span>: <span id="waDisplay" dir="ltr"></span></p>
      <p><span data-i18n="foot.mail">البريد</span>: hello@campstore.com</p>
    </div>
  </div>
</footer>

<!-- ════════ سلة المشتريات / Cart panel ════════ -->
<div class="scrim" id="scrim" hidden></div>

<section class="cart-panel" id="cartPanel" role="dialog" aria-modal="false" aria-label="Cart">
  <div class="grab"></div>
  <div class="cart-head">
    <h2 data-i18n="cart.title">سلة المشتريات</h2>
    <button class="icon-btn sm" id="closeCart" data-i18n-aria="aria.close" aria-label="إغلاق">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <div class="lines" id="lines"></div>

  <div class="cart-foot" id="cartFoot" hidden>
    <p class="ship-note" id="shipNote"></p>
    <div class="total"><span data-i18n="cart.total">الإجمالي</span><b id="total">0</b></div>
    <button class="btn wa block" id="checkout">
      <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.3 1.3-1.9 1.4-.5 0-1.1.2-3.6-.8-3-1.3-5-4.4-5.1-4.6-.2-.2-1.2-1.6-1.2-3.1 0-1.5.8-2.2 1-2.5.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.4-.1.7.2.3.8 1.4 1.8 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.2.4-.2.6-.1l2.2 1c.3.1.5.2.5.4z"/></svg>
      <span data-i18n="cart.checkout">إتمام الطلب عبر واتساب</span>
    </button>
    <button class="link-btn" id="clearCart" data-i18n="cart.clear">إفراغ السلة</button>
  </div>
</section>

<!-- ════════ نافذة المنتج / Product dialog ════════ -->
<dialog id="modal">
  <div class="modal">
    <div class="modal-top">
      <div class="art" id="mArt"></div>
      <div>
        <h3 id="mName"></h3>
        <p class="desc" id="mDesc"></p>
        <p class="price" id="mPrice"></p>
      </div>
    </div>
    <div class="modal-body">
      <div class="label" data-i18n="modal.size">اختر المقاس</div>
      <div class="sizes" id="mSizes"></div>
      <div class="modal-actions">
        <button class="btn wa block" id="mBuyNow">
          <svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.3 1.3-1.9 1.4-.5 0-1.1.2-3.6-.8-3-1.3-5-4.4-5.1-4.6-.2-.2-1.2-1.6-1.2-3.1 0-1.5.8-2.2 1-2.5.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.4-.1.7.2.3.8 1.4 1.8 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.2.4-.2.6-.1l2.2 1c.3.1.5.2.5.4z"/></svg>
          <span data-i18n="modal.buy">اطلب الآن عبر واتساب</span>
        </button>
        <div class="row2">
          <button class="btn ghost" id="mAdd"   data-i18n="modal.add">أضف إلى السلة</button>
          <button class="btn ghost" id="mClose" data-i18n="modal.close">إغلاق</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<!-- ════════ زر واتساب العائم ════════ -->
<button class="wa-float" id="waFloat" data-i18n-aria="aria.wa" aria-label="واتساب">
  <svg width="27" height="27" viewBox="0 0 24 24" fill="#08301A" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15L2 22l5.2-1.4A10 10 0 1 0 12 2zm5.6 14.1c-.2.7-1.3 1.3-1.9 1.4-.5 0-1.1.2-3.6-.8-3-1.3-5-4.4-5.1-4.6-.2-.2-1.2-1.6-1.2-3.1 0-1.5.8-2.2 1-2.5.3-.3.6-.4.8-.4h.6c.2 0 .4 0 .7.5l.9 2.2c.1.2.1.4 0 .6l-.4.6-.4.4c-.1.2-.3.4-.1.7.2.3.8 1.4 1.8 2.3 1.3 1.1 2.3 1.5 2.6 1.6.3.1.5.1.7-.1l1-1.2c.2-.2.4-.2.6-.1l2.2 1c.3.1.5.2.5.4z"/></svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script (1).js"></script>
</body>
</html>
